[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp2210-wrapper"
version = "0.1.0"
description = "ctypes wrapper for the Microchip MCP2210 USB-to-SPI DLL, plus lab instrument helpers"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "matplotlib",
    "pandas",
    "pyvisa",
    "scipy",
]

[tool.setuptools.packages.find]
include = ["instrumentation*"]

[tool.setuptools.package-data]
"instrumentation.PCBs" = ["*.dll", "MCP2210/*.dll", "MCP2210/*.h"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# ruff's default rule set, pinned so a user-level ruff config doesn't change the result
select = ["E4", "E7", "E9", "F"]
